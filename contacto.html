<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Velocidad Flugel</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo">
        <img src="images/logo.png" alt="Imagen de logo" class="logo-img">
            <a href="index.html">
            <h1>Flugel</h1>
            </a></div>
        <nav>
            <ul>
                <li><a href="articulo.html">ARTICULOS</a></li>
                <li><a href="contacto.html">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contacto</h1>
        <form id="contactForm" novalidate>
            <div>
                <label for="nombre">Nombre y Apellido:</label>
                <input type="text" id="nombre" placeholder="Campo Obligatorio." required>
            </div>  
            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="nombredeusuario@proveedor.com" required>
            </div>
            <div>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" placeholder="+5492664XXXXXX" required>
            </div>
            <div>
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" placeholder="Campo Opcional."></textarea>
            </div>
            
            <ul id="errorList"></ul>

            <button type="submit">Enviar</button>
        </form>
        <div id="resultado"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
